name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Go vet/build/test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: git available for shell-out tests
        run: git --version

      - name: gofmt
        # git ls-files keeps gofmt out of frontend/node_modules, where third-party
        # .go files live after npm install
        shell: bash
        run: test -z "$(gofmt -l $(git ls-files '*.go'))"

      - name: vet and build
        run: |
          go vet ./ ./internal/...
          go build ./ ./internal/...
        shell: bash

      - name: test with coverage
        run: go test -cover ./ ./internal/...

  frontend:
    name: Frontend lint/typecheck/test/build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: install
        run: npm ci

      - name: lint
        run: npm run lint

      - name: typecheck and build
        run: npm run build

      - name: test with coverage thresholds
        run: npm run coverage

  wails-build:
    name: wails build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Linux webview toolchain
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libsoup-3.0-dev

      - name: install Wails CLI
        # keep in sync with the wails/v2 version in go.mod
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.16.0

      - name: build
        # webkit2_41: Wails defaults to webkit2gtk-4.0 for cgo; the installed
        # dev packages are the 4.1/soup3 stack, matching ubuntu-24.04's default
        run: wails build -tags webkit2_41

      - name: upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: wails-build-failure-${{ matrix.os }}
          path: build/bin/
          if-no-files-found: ignore
