name: Release

# Stub: builds a binary per OS on each v* tag. Installers, signing,
# notarization and the published release are #82/#83/#84.

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Linux webview toolchain
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libsoup-3.0-dev

      - name: install Wails CLI
        # keep in sync with the wails/v2 version in go.mod
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.16.0

      - name: build
        # webkit2_41: match the 4.1/soup3 dev packages installed for linux
        run: wails build -tags webkit2_41

      - name: bundle macOS app
        if: matrix.os == 'macos-latest'
        run: cd build/bin && ditto -c -k --sequesterRsrc gowit.app gowit.app.zip

      - name: upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: gowit-${{ matrix.os }}
          path: |
            build/bin/gowit
            build/bin/gowit.exe
            build/bin/gowit.app.zip
          if-no-files-found: error
